name: Update IPO tracker

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours at :17 (UTC). On a public repository this can be hourly: "17 * * * *"
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:                     # also run when the tracker itself changes
    branches: [main]
    paths: ["tracker.py", "reader.py", "reader_model.py", "site/**", "data/breakdowns/**", ".github/workflows/update.yml"]

permissions:
  contents: write           # so the job can save the updated list back to the repository

concurrency:
  group: ipo-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Update the list from SEC EDGAR
        run: python tracker.py
        env:
          # The SEC requires a contact on every request. Override it with a repository variable of the same name.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'IPO Query info@ipoquery.com' }}
      - name: Read the latest prospectus for each deal
        continue-on-error: true   # a problem here must not stop the list from updating
        run: python reader.py
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'IPO Query info@ipoquery.com' }}
      - name: Test the model step on two filings (asks a model only when an API key is set)
        continue-on-error: true
        run: python reader_model.py
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'IPO Query info@ipoquery.com' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Rebuild the page with the breakdowns
        run: python tracker.py --render-only
      - name: Save changes
        run: |
          git config user.name "ipo-tracker"
          git config user.email "ipo-tracker@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Update IPO list"
          git push
