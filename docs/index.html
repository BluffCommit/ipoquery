<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPO Query</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600..700&display=swap">
<style>
:root{
  /* Report view: a research sheet. Greyscale structure, maroon for emphasis and the company's side, gold for money going to insiders. */
  --bg:#ffffff;--shade:#f4f4f3;--shade2:#e9e9e7;--band:#1f1f1f;--band-ink:#ffffff;
  --ink:#141414;--ink2:#555553;--line:#cfcfcc;--line2:#e7e7e4;--track:#dededb;
  --maroon:#7b1e2b;--maroon-fill:#8c2535;--maroon-wash:#f6e9eb;
  --gold:#7a5f14;--gold-fill:#c2a03a;--gold-wash:#f7f0d8;--on-gold:#1d1606;
  --head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#121212;--shade:#1b1b1b;--shade2:#262625;--band:#dcdcd9;--band-ink:#121212;
  --ink:#ececea;--ink2:#a8a8a5;--line:#3a3a38;--line2:#272726;--track:#333331;
  --maroon:#e7a0aa;--maroon-fill:#a8394a;--maroon-wash:#2a1518;
  --gold:#dcba5c;--gold-fill:#c2a03a;--gold-wash:#2b2514}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121212;--shade:#1b1b1b;--shade2:#262625;--band:#dcdcd9;--band-ink:#121212;
  --ink:#ececea;--ink2:#a8a8a5;--line:#3a3a38;--line2:#272726;--track:#333331;
  --maroon:#e7a0aa;--maroon-fill:#a8394a;--maroon-wash:#2a1518;
  --gold:#dcba5c;--gold-fill:#c2a03a;--gold-wash:#2b2514}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scroll{overflow-x:auto}
.muted{color:var(--ink2)}

/* header and footer */
.hdr{border-top:4px solid var(--ink);border-bottom:1px solid var(--ink)}
.hdr-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:13px}
.logo{font:700 25px/1 var(--head);letter-spacing:.04em;text-decoration:none;white-space:nowrap}
.logo span{color:var(--maroon)}
.hsearch{flex:1 1 260px;max-width:420px;display:flex}
.hsearch input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--bg);border-radius:0}
.hnav{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.hnav a{text-decoration:none;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center}
.ftr{border-top:1px solid var(--ink);color:var(--ink2);margin-top:44px}
.ftr-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-block:20px 40px;font-size:13px}

/* shared pieces */
.eyebrow{font:600 11.5px/1.3 var(--cond);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:0}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;background:var(--band);color:var(--band-ink);padding:8px 12px;border-bottom:2px solid var(--gold-fill);margin:0}
.bar h2{margin:0;font:600 12.5px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase}
.bar span{font-size:12.5px;opacity:.85}
.hair{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-top:0}
.hair>*{background:var(--bg);min-width:0}
.stack{display:grid;gap:30px}
.stack>*,.cols>*,.main>*{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px;align-items:start}
.main{display:grid;gap:30px}
.src{font-size:12px;color:var(--ink2)}
.src a{text-decoration-color:var(--line)}
.tag{display:inline-block;font:600 10.5px/1.5 var(--cond);letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);padding:0 5px;color:var(--ink2);white-space:nowrap}
.stage{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.stage::before{content:"";width:9px;height:9px;border:1.5px solid var(--ink2);flex:none}
.stage[data-s="amended"]::before{background:linear-gradient(90deg,var(--ink2) 50%,transparent 50%)}
.stage[data-s="effective"]::before{background:var(--ink2)}
.stage[data-s="priced"]::before{background:var(--maroon-fill);border-color:var(--maroon-fill)}
.stage[data-s="closed"]::before{background:repeating-linear-gradient(135deg,var(--ink2) 0 2px,transparent 2px 4px)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-block:28px 30px;align-items:start}
.h1{font:700 clamp(30px,4.4vw,46px)/1.07 var(--head);margin:.3em 0 .35em;text-wrap:balance;max-width:19ch}
.h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--gold-wash) 62%)}
.lede{font-size:16.5px;line-height:1.55;color:var(--ink2);max-width:60ch;margin:0 0 18px}
.search{display:flex;max-width:620px}
.search input{flex:1;min-width:0;height:46px;border:1px solid var(--ink2);border-right:0;background:var(--bg);padding:0 14px;font-size:15px;border-radius:0}
.search button{height:46px;padding:0 22px;border:0;background:var(--band);color:var(--band-ink);font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.snap{border:1px solid var(--line)}
.snap h2{margin:0;background:var(--band);color:var(--band-ink);font:600 11.5px/1 var(--cond);letter-spacing:.09em;text-transform:uppercase;padding:9px 12px;border-bottom:2px solid var(--gold-fill)}
.snap dl{margin:0;display:grid;grid-template-columns:1fr auto}
.snap dt,.snap dd{margin:0;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.snap dt{color:var(--ink2)}
.snap dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.snap dl>:nth-child(4n+1),.snap dl>:nth-child(4n+2){background:var(--shade)}
.snap p{margin:0;padding:8px 12px;font-size:12px;color:var(--ink2)}
.feat{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.card{padding:16px 18px;display:grid;gap:10px;align-content:start}
.card-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:600 11px/1.4 var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.date{background:var(--maroon-wash);color:var(--maroon);padding:1px 6px;white-space:nowrap}
.card h3{margin:0;font:700 22px/1.15 var(--head)}
.card h3 a{text-decoration:none}
.card p{margin:0;color:var(--ink2);font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line2);padding-block:9px}
.trio div+div{border-left:1px solid var(--line2);padding-left:12px}
.trio b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.trio b.g{color:var(--gold)}
.trio small{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.more{font-weight:600;font-size:14px}
.card-l{display:contents}
.card .trio{order:2}.card .more{order:3}
.card.solo{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;column-gap:36px}
.card.solo .card-l{display:grid;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px;background:var(--shade);border:1px solid var(--line);border-top:0}
.tabs{display:flex;flex-wrap:wrap;margin-right:auto;border:1px solid var(--ink2)}
.tabs button{min-height:38px;padding:0 13px;border:0;background:var(--bg);cursor:pointer;font:600 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tabs button+button{border-left:1px solid var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--band);color:var(--band-ink)}
.filters label{display:grid;gap:3px;font:600 11px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.filters select{height:38px;min-width:150px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font:14px var(--body);color:var(--ink);border-radius:0}
.filters label.chk{display:flex;align-items:center;gap:7px;min-height:38px;font:14px var(--body);text-transform:none;letter-spacing:0;color:var(--ink)}
.tbox{border:1px solid var(--line);border-top:0}
.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--shade2);text-align:left;font:600 11px/1.25 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--ink2);vertical-align:bottom;white-space:nowrap}
.tbl th.num{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:var(--shade)}
.tbl small{display:block;color:var(--ink2);font-size:12px}
.tbl .co{font:600 15px/1.25 var(--head)}
.tbl .co a{text-decoration-color:var(--maroon-fill);text-decoration-thickness:1.5px}
.tfoot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:9px 12px;font-size:12.5px;color:var(--ink2);background:var(--shade);border-top:1px solid var(--line)}
.tfoot button{min-height:34px;padding:0 14px;border:1px solid var(--ink2);background:var(--bg);cursor:pointer;font:600 12px var(--cond);letter-spacing:.06em;text-transform:uppercase}
.none{padding:22px 12px;color:var(--ink2)}
.rail{display:grid;gap:22px}
.rbox h2{margin:0;font:600 12px/1.2 var(--cond);letter-spacing:.09em;text-transform:uppercase;padding:8px 0 7px;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.rbox ul{list-style:none;margin:0;padding:0}
.rbox li{padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.rbox li a{font-weight:600;text-decoration:none}
.rbox li a:hover{text-decoration:underline}
.rbox li small{display:block;color:var(--ink2);font-size:12px}
.rbox .kv{display:flex;justify-content:space-between;gap:10px}
.rbox .kv span{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.rbox .kv button{all:unset;cursor:pointer;font-weight:600}
.rbox .kv button:hover{text-decoration:underline}
.rbox .kv button:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.rbox p{font-size:13.5px;color:var(--ink2);margin:10px 0 0}

/* IPO page */
.crumb{display:inline-flex;align-items:center;min-height:40px;margin-top:12px;font-size:13.5px;font-weight:600;text-decoration:none}
.cohead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 30px;align-items:end;padding-bottom:18px}
.cohead h1{font:700 clamp(30px,4vw,44px)/1.05 var(--head);margin:4px 0 6px;text-wrap:balance}
.cohead p{margin:0;color:var(--ink2)}
.meta{font-size:13px;margin-top:6px!important}
.meta a,.meta b{color:var(--ink)}
.keys{grid-template-columns:repeat(4,minmax(118px,1fr));border-top:1px solid var(--line)}
.keys>div{padding:10px 14px}
.keys b{display:block;font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.keys small{display:block;font-size:12px;color:var(--ink2);line-height:1.3;max-width:17ch}
.keys>.hi{background:var(--maroon-wash)}
.keys>.hi b{color:var(--maroon)}
.stepsbox{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:14px 0 12px}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);position:relative;margin:0;padding:0;list-style:none}
.steps::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:2px;background:var(--track)}
.steps li{position:relative;padding:20px 10px 0 0;font-size:13px;line-height:1.35}
.steps li::before{content:"";position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);background:var(--bg)}
.steps li.done::before{background:var(--ink2)}
.steps li.now::before{background:var(--maroon-fill);border-color:var(--maroon-fill);box-shadow:0 0 0 4px var(--maroon-wash)}
.steps li b{display:block;font-weight:600}
.steps li small{color:var(--ink2);font-size:12.5px}
.steps li.now b{color:var(--maroon)}
.min{grid-template-columns:repeat(4,minmax(0,1fr))}
.min>div{padding:14px 16px}
.min h3,.mod h3{margin:0 0 6px;font:700 17px/1.25 var(--head);text-wrap:balance}
.min p{margin:0;font-size:14px;line-height:1.5}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mod{padding:16px 18px 14px;display:grid;gap:10px;align-content:start}
.mod>p{margin:0;font-size:14px;color:var(--ink2)}
.mod.wide{grid-column:1/-1}
.range{position:relative;height:74px;margin:4px 6px 0}
.range .trk{position:absolute;left:0;right:0;top:30px;height:12px;background:var(--track)}
.range .band{position:absolute;top:30px;height:12px;background:var(--ink2)}
.range .mk{position:absolute;top:22px;width:3px;height:28px;background:var(--maroon-fill);transform:translateX(-1px)}
.range .mkl{position:absolute;top:0;transform:translateX(-50%);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--maroon)}
.range .tk{position:absolute;top:50px;transform:translateX(-50%);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.split{display:flex;height:30px;font-size:12.5px;font-weight:600;gap:2px}
.split div{display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;min-width:3px}
.split .co{background:var(--maroon-fill);color:#fff}
.split .se{background:var(--gold-fill);color:var(--on-gold);padding:0}
.split .pub{background:var(--band);color:var(--band-ink);padding:0}
.split .rest{background:var(--shade2);color:var(--ink2)}
.key{margin:0;font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 16px}
.key i{display:inline-block;width:10px;height:10px;margin-right:5px}
.scen{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:460px}
.scen th,.scen td{padding:7px 10px;border-bottom:1px solid var(--line2)}
.scen thead th{background:var(--shade2);font:600 11px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:right}
.scen thead th:first-child{text-align:left}
.scen tbody th{text-align:left;font-weight:500;color:var(--ink2)}
.scen td{text-align:right}
.scen .mid{background:var(--maroon-wash);font-weight:600}
.colchart{display:flex;align-items:flex-end;gap:22px;height:170px;padding:0 4px;border-bottom:1px solid var(--ink2)}
.colchart div{flex:0 1 72px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:13px;font-weight:600;white-space:nowrap}
.colchart i{display:block;width:100%;min-height:2px;background:var(--ink2)}
.colchart i.part{background:repeating-linear-gradient(135deg,var(--maroon-fill) 0 4px,transparent 4px 7px);outline:1.5px solid var(--maroon-fill);outline-offset:-1.5px}
.xl{display:flex;gap:22px;padding:4px 4px 0;font-size:12px;color:var(--ink2)}
.xl span{flex:0 1 72px;text-align:center}
.rows{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px 12px;align-items:center;font-size:13.5px}
.rows.r2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto}
.rows .lab{font-weight:600}
.rows .lab small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.rows .trk{height:14px;background:var(--shade2);position:relative}
.rows .trk i{position:absolute;inset:0 auto 0 0;background:var(--ink2)}
.rows .trk i.g{background:var(--gold-fill)}
.rows .trk i.m{background:var(--maroon-fill)}
.rows .trk i.x{background:repeating-linear-gradient(135deg,var(--ink2) 0 3px,transparent 3px 6px)}
.rows .trk .one{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed var(--ink)}
.rows .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.trio2{grid-template-columns:repeat(3,minmax(0,1fr))}
.trio2>div{padding:14px 18px}
.trio2 b{display:block;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums}
.trio2 small{color:var(--ink2);font-size:12.5px}
.hold{width:100%;min-width:620px;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.hold th{background:var(--shade2);font:600 11px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:8px 10px;text-align:left;border-bottom:1px solid var(--ink2)}
.hold th.num{text-align:right}
.hold td{padding:8px 10px;border-bottom:1px solid var(--line2)}
.hold tbody tr:nth-child(even) td{background:var(--shade)}
.hold td:first-child{font-weight:600}
.hold .g{color:var(--gold);font-weight:600}
.tl{width:100%;border-collapse:collapse;font-size:14px}
.tl th{width:190px;text-align:left;font-weight:600;padding:10px 14px;vertical-align:top}
.tl td{padding:10px 14px}
.tl tr{border-bottom:1px solid var(--line2)}
.tl tr:last-child{border-bottom:0}
.tl tr.hi{background:var(--maroon-wash)}
.tl tr.hi th{color:var(--maroon)}
.tl tr.done th,.tl tr.done td{color:var(--ink2)}
.risks{margin:0;padding:14px 18px 14px 40px;font-size:14.5px;display:grid;gap:7px}
.risks li::marker{font-weight:700;color:var(--maroon)}
.note{font-size:12.5px;color:var(--ink2);margin:0;padding:10px 18px}
.pending{padding:18px;display:grid;gap:8px}
.pending h3{margin:0;font:700 18px/1.25 var(--head)}
.pending p,.pending ul{margin:0;font-size:14px;color:var(--ink2)}
.pending ul{padding-left:18px}
@media (max-width:980px){.hero,.cols,.cohead{grid-template-columns:minmax(0,1fr)}.snap{max-width:420px}.min{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid2,.min,.trio2,.card.solo{grid-template-columns:minmax(0,1fr)}.keys{grid-template-columns:repeat(2,minmax(0,1fr))}.hnav{margin-left:0}.tl th{width:auto}}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="#home">IPO <span>QUERY</span></a>
    <form class="hsearch" id="hsearch" role="search">
      <label class="sr" for="hq">Search a company or ticker</label>
      <input id="hq" type="search" placeholder="Search a company or ticker" autocomplete="off">
    </form>
    <nav class="hnav" aria-label="Site">
      <a href="#home" data-go="upcoming">Upcoming</a>
      <a href="#home" data-go="priced">Priced</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer class="ftr">
  <div class="wrap ftr-in">
    <span>IPO Query · Built from SEC filings. Every number links to the filing it came from. A number that fails a consistency check is hidden, not guessed.</span>
    <span>Not investment advice.</span>
  </div>

        <div class="trk"></div><div class="band" style="left:${pos(o.low)};width:${(o.high - o.low) / (a1 - a0) * 100}%"></div>
        <div class="mk" style="left:${pos(P)}"></div><div class="mkl" style="left:${pos(P)}">${price(P)} ${priced ? 'final price' : 'midpoint'}</div>
        <span class="tk" style="left:0;transform:none">${price(a0)}</span><span class="tk" style="left:${pos(o.low)}">${price(o.low)}</span><span class="tk" style="left:${pos(o.high)}">${price(o.high)}</span><span class="tk" style="left:100%;transform:translateX(-100%)">${price(a1)}</span>
      </div>${src(b, 'cover page')}`}; }
  else rangeMod = {html: `<h3>The final price is ${price(P)} a share</h3><p>The price range set before pricing has not been read.</p>${src(b, 'cover page')}`};
  const splitMod = {html: m.se ? `<h3>${pc(m.co, m.raised)} of the money goes to the company</h3><p>The rest, ${pc(m.se, m.raised)}, goes to existing holders selling their own shares.</p>
      <div class="split" role="img" aria-label="${pc(m.co, m.raised)} to the company, ${pc(m.se, m.raised)} to selling holders"><div class="co" style="flex:${m.co} 1 0">${money(m.co)} to the company</div><div class="se" style="flex:${m.se} 1 0"></div></div>
      <p class="key"><span><i style="background:var(--maroon-fill)"></i>Company ${money(m.co)}</span><span><i style="background:var(--gold-fill)"></i>Selling holders ${money(m.se)}</span></p>${src(b, 'cover page')}`
    : `<h3>All of the money goes to the company</h3><p>No existing holder is selling shares in the IPO.</p>
      <div class="split" role="img" aria-label="All of the money goes to the company"><div class="co" style="flex:1 1 0">${money(m.co)} to the company</div></div>${src(b, 'cover page')}`};
  const floatMod = o.shares_after ? {html: `<h3>Only ${pc(m.shares, o.shares_after, 1)} of the company ${priced ? 'was sold' : 'will trade'}</h3><p>${shares(m.shares)} of ${shares(o.shares_after)} shares are sold in the IPO. The rest stay with insiders and earlier investors.</p>
      <div class="split" role="img" aria-label="${pc(m.shares, o.shares_after, 1)} sold in the IPO"><div class="pub" style="flex:${m.shares} 1 0"></div><div class="rest" style="flex:${o.shares_after - m.shares} 1 0">${pc(o.shares_after - m.shares, o.shares_after, 1)} kept by existing holders</div></div>${src(b, 'The offering')}`} : null;
  const useMod = b.proceeds ? {html: `<h3>What the company says it will do with its share</h3><p>${esc(b.proceeds)}</p>${b.side_sale ? `<p>${esc(b.side_sale)}</p>` : ''}${src(b, 'Use of proceeds')}`} : null;
  let scenMod = null;
  if (hasRange && !priced) { const lo = calc(b, o.low), hi = calc(b, o.high), lines = [['Raised', c => money(c.raised)], ['To the company', c => money(c.co)]];
    if (m.se) lines.push(['To selling holders', c => money(c.se)]);
    if (m.val) lines.push(['Company value', c => money(c.val)]);
    if (rounds.length) { const f = rounds[0], l = rounds[rounds.length - 1]; lines.push([f.name + ' return', c => X(c.p / f.price)], [l.name + ' return', c => X(c.p / l.price)]); }
    scenMod = {wide: 1, html: `<h3>Where the price lands changes who gets what</h3>
      <div class="scroll"><table class="scen"><thead><tr><th>If it prices at</th><th>Low, ${price(o.low)}</th><th class="mid">Midpoint, ${price(P)}</th><th>High, ${price(o.high)}</th></tr></thead><tbody>
      ${lines.map(([l, f]) => `<tr><th>${esc(l)}</th><td>${f(lo)}</td><td class="mid">${f(m)}</td><td>${f(hi)}</td></tr>`).join('')}
      </tbody></table></div>${src(b, rounds.length ? 'cover page; preferred stock note' : 'cover page')}`}; }

  /* how's the business */
  let business = pending('The financial statements in this filing have not been read yet.');
  if (fin) { const cols = [...fy, ...(fin.ytd ? [{label: fin.ytd.label, revenue: fin.ytd.revenue, operating: fin.ytd.operating, part: 1}] : [])];
    const hasRev = cols.every(y => y.revenue != null) && cols.some(y => y.revenue > 0), maxRev = Math.max(...cols.map(y => y.revenue || 0)), maxRes = Math.max(...cols.map(y => Math.abs(y.operating)));
    const revMod = hasRev ? {html: `<h3>${fy.length > 1 && fy[0].revenue > 0 ? `Revenue went from ${M6(fy[0].revenue)} to ${M6(lastY.revenue)} in ${fy.length - 1} year${fy.length > 2 ? 's' : ''}` : `Revenue was ${M6(lastY.revenue)} ${inP(lastY.label)}`}</h3>
      <p>${fin.ytd ? `The hatched bar is ${fin.ytd.label}, a part year: ${M6(fin.ytd.revenue)}${fin.ytd.prior_revenue != null ? `, against ${M6(fin.ytd.prior_revenue)} in ${fin.ytd.prior_label}` : ''}.` : 'Revenue for each financial year.'}</p>
      <div class="colchart" role="img" aria-label="Revenue by period">${cols.map(y => `<div><span>${M6(y.revenue)}</span><i${y.part ? ' class="part"' : ''} style="height:${y.revenue / maxRev * 130}px"></i></div>`).join('')}</div>
      <div class="xl">${cols.map(y => `<span>${esc(y.label)}</span>`).join('')}</div>${src(b, 'statements of operations')}`} : null;
    const resMod = {html: `<h3>${net ? (lastY.operating < 0 ? 'It made a net loss ' : 'It made a net profit ') + inP(lastY.label) : lastY.operating < 0 ? 'It loses money from operations' : 'It earns money from operations'}</h3>
      <p>${net ? 'Net result' : 'Operating result'} each period. Parentheses mean a loss.</p>
      <div class="rows">${cols.map(y => `<span class="lab">${esc(y.label)}</span><span class="trk"><i class="${y.operating < 0 ? '' : 'm'}" style="width:${maxRes ? Math.abs(y.operating) / maxRes * 100 : 0}%"></i></span><span class="v">${P6(y.operating)}</span>`).join('')}</div>${src(b, 'statements of operations')}`};
    const facts = fin.facts || [];
    business = grid([revMod, resMod])
      + (facts.length ? `<div class="hair trio2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${facts.map(f => `<div><b>${f.signed && f.value > 0 ? '+' : ''}${M6(f.value)}</b><small>${esc(f.label)}</small></div>`).join('')}</div>` : '')
      + (fin.note ? `<p class="note">${esc(fin.note)}</p>` : ''); }

  /* who's cashing out */
  const holders = [...sellers, ...(b.others || [])];
  let trail = [];
  if (sellers.length) { const maxSell = Math.max(...sellers.map(x => x.sold));
    trail.push({html: `<h3>${sellers.length} holders split ${money(m.se)} in the IPO</h3><p>Value of the shares each sells at ${priced ? 'the IPO price' : 'the ' + price(P) + ' midpoint'}, before underwriting fees.</p>
      <div class="rows r2">${sellers.map(x => `<span class="lab">${esc(x.name)}<small>${esc(x.role)} · sells ${pc(x.sold, x.before, 1)} of stake</small></span><span class="trk"><i class="g" style="width:${x.sold / maxSell * 100}%"></i></span><span class="v">${money(x.sold * P)}</span>`).join('')}</div>${src(b, 'Principal and selling stockholders')}`}); }
  else if (m.se) trail.push({html: `<h3>Existing holders sell ${money(m.se)} of shares in the IPO</h3><p>That is ${shares(o.holder_shares)} ${U}, ${pc(m.se, m.raised)} of the deal. Who the sellers are has not been read from this filing yet.</p>${src(b, 'cover page')}`});
  if (rounds.length) { const top = bestRound(b), L = Math.log, lw = x => Math.max(2, (L(x) - L(.5)) / (L(top * 1.4) - L(.5)) * 100), first = rounds[0], lastR = rounds[rounds.length - 1], under = rounds.filter(q => P < q.price);
    trail.push({html: `<h3>${esc(first.name)} investors are up ${X(P / first.price)}${under.length ? '. The last round is under water' : `. ${esc(lastR.name)} is up ${X(P / lastR.price)}`}</h3><p>Price paid per share in each round, against ${price(P)}. Log scale; the dashed line is break-even.</p>
      <div class="rows">${rounds.map(q => { const x = P / q.price; return `<span class="lab">${esc(q.name)}${q.when ? ', ' + esc(q.when) : ''}<small>paid $${q.price.toFixed(2)} a share</small></span><span class="trk"><i class="${x < 1 ? 'x' : 'm'}" style="width:${lw(x)}%"></i><span class="one" style="left:${lw(1)}%"></span></span><span class="v">${X(x)}${x < 1 ? ', a loss' : ''}</span>`; }).join('')}</div>
      ${b.rounds_note ? `<p style="font-size:12.5px">${esc(b.rounds_note)}</p>` : ''}${src(b, 'preferred stock note')}`}); }
  if (holders.length) trail.push({wide: 1, html: `<h3>The holders named in the filing</h3><p>Shares held before the IPO, how much each is registered to sell, and the stake left after it.</p>
      <div class="scroll"><table class="hold"><thead><tr><th>Holder</th><th>Role</th><th class="num">Shares before</th><th class="num">Selling</th><th class="num">Share of stake sold</th><th class="num">Stake after IPO</th></tr></thead><tbody>
      ${holders.map(h => `<tr><td>${esc(h.name)}</td><td>${esc(h.role)}</td><td class="num">${shares(h.before)}</td><td class="num ${h.sold ? 'g' : ''}">${h.sold ? shares(h.sold) : 'None'}</td><td class="num">${h.sold ? pc(h.sold, h.before, 1) : '—'}</td><td class="num">${o.shares_after ? pc(h.before - h.sold, o.shares_after, h.before / o.shares_after < .01 ? 2 : 1) : '—'}</td></tr>`).join('')}
      </tbody></table></div>
      ${b.holders_note ? `<p>${esc(b.holders_note)}</p>` : ''}${b.control_note ? `<p>${esc(b.control_note)}</p>` : ''}${src(b, 'Principal and selling stockholders')}`});
  const trailHTML = (trail.length ? grid(trail) : '') + (sellers.length && rounds.length ? '' : pending(`${sellers.length ? '' : 'Who holds the shares'}${sellers.length || rounds.length ? '' : ', and '}${rounds.length ? '' : (sellers.length ? 'What' : 'what') + ' earlier investors paid for theirs'}, has not been read from this filing yet.`));

  /* what happens next */
  let nextHTML = '';
  if (pricingAhead) nextHTML += `<div class="hair"><table class="tl"><tbody>
      <tr class="hi"><th>${dayW(o.expected_pricing)}</th><td>The final price is expected to be set. A final prospectus follows with the share counts.</td></tr>
      ${o.expected_trading ? `<tr><th>${dayW(o.expected_trading)}</th><td>Shares are expected to start trading on ${esc(b.exchange)}${r.tickers.length ? ' as ' + esc(r.tickers[0]) : ''}.</td></tr>` : ''}
      </tbody></table></div><p class="note">Dates: <a href="${esc(o.dates_url)}">${esc(o.dates_from)} ↗</a>. They are not in the filing and can move.</p>`;
  if (b.lockup) { const lockMax = Math.max(...b.lockup.events.map(e => e.shares)), lockTotal = b.lockup.events.reduce((t, e) => t + e.shares, 0);
    nextHTML += `<div class="hair"${pricingAhead ? ' style="border-top:1px solid var(--line);margin-top:6px"' : ''}><div class="mod"><h3>When insiders can sell</h3><p>${esc(b.lockup.summary)} In total, up to ${shares(lockTotal)} more shares can come to market, ${Math.round(lockTotal / m.shares)} times the number sold in the IPO.</p>
      <div class="rows r2">${b.lockup.events.map(e => `<span class="lab">${esc(e.when)}<small>${esc(e.what)}</small></span><span class="trk"><i style="width:${e.shares / lockMax * 100}%"></i></span><span class="v">up to ${shares(e.shares)}</span>`).join('')}</div>${src(b, 'Shares eligible for future sale')}</div></div>`; }
  else nextHTML += pending(`${pricingAhead ? '' : priced ? '' : 'The filing gives no pricing date; that is announced separately. '}When insiders are allowed to sell has not been read from this filing yet.`);

  const manual = b.method === 'manual';
  return head(keys) + `
  <div class="wrap stack" style="margin-top:22px">
    <section><div class="bar"><h2>In one minute</h2><span>${manual ? 'Read by hand' : 'Read automatically'} on ${day(b.loaded)}</span></div>
      <div class="hair min">
        <div><h3>The deal</h3><p>${deal}</p></div><div><h3>The business</h3><p>${biz}</p></div>
        <div><h3>Who’s cashing out</h3><p>${cash}</p></div><div><h3>What happens next</h3><p>${next}</p></div>
      </div></section>
    <div class="cols"><div class="main">
      <section><div class="bar"><h2>What’s the deal?</h2><span>From the filing dated ${day(b.doc_date || b.range_set)}</span></div>${grid([rangeMod, splitMod, floatMod, useMod, scenMod])}</section>
      <section><div class="bar"><h2>How’s the business?</h2><span>${fin ? 'From the financial statements in the filing' : 'Not read yet'}</span></div>${business}</section>
      <section><div class="bar"><h2>Who’s cashing out?</h2><span>The money trail</span></div>${trailHTML}</section>
      <section><div class="bar"><h2>What happens next?</h2></div>${nextHTML}</section>
      ${b.risks && b.risks.length ? `<section><div class="bar"><h2>Risks the company lists first</h2><span>${esc(b.risks_note || '')}</span></div>
        <div class="hair"><ol class="risks">${b.risks.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div><p class="note">${src(b, 'Risk factors')}</p></section>` : ''}
    </div>
    <aside class="rail">${filingsBox(r)}
      <section class="rbox"><h2>How this page is made</h2><p>${manual ? `This breakdown was read by hand from ${esc(b.basis)}, as the first test of the format. The automated reader will replace it.` : `Read automatically from ${esc(b.basis)}. A figure is shown only if it passes a consistency check.`} ${priced ? '' : 'Dollar figures use the midpoint of the price range until the deal prices.'}</p></section>
      ${b.checks && b.checks.length ? `<section class="rbox"><h2>Checks passed</h2><ul>${b.checks.map(c => `<li><b style="font-weight:600">${esc(c.item)}</b><small>${esc(c.how)}</small></li>`).join('')}</ul></section>` : ''}
      ${b.hidden && b.hidden.length ? `<section class="rbox"><h2>Left out</h2><ul>${b.hidden.map(c => `<li><b style="font-weight:600">${esc(c.item)}</b><small>${esc(c.why)}</small></li>`).join('')}</ul></section>` : ''}
    </aside></div>
  </div>`;
}

/* ---------- routing ---------- */
function render(){
  const h = (location.hash || '').slice(1), app = document.getElementById('app');
  const m = /^ipo-(\d+)$/.exec(h), r = m && BY[m[1]];
  if (r) { app.innerHTML = ipoPage(r); document.title = nice(r.name) + ' · IPO Query'; }
  else { app.innerHTML = home(); bindHome(); document.title = 'IPO Query'; }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); F.tab = a.dataset.go; F.q = ''; F.stage = ''; F.limit = 40;
  if (location.hash && location.hash !== '#home') location.hash = '#home'; else render();
  setTimeout(() => { const el = document.getElementById('all-ipos'); if (el) el.scrollIntoView(); }, 30);
}));
document.getElementById('hsearch').addEventListener('submit', e => {
  e.preventDefault(); search(document.getElementById('hq').value);
  if (location.hash && location.hash !== '#home') location.hash = '#home'; else render();
  setTimeout(() => { const el = document.getElementById('all-ipos'); if (el) el.scrollIntoView(); }, 30);
});
render();
</script>
</body>
</html>
